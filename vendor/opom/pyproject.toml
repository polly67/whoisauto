[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opom"
version = "0.1.0"
description = "Local macOS HTTP API for Opiumware Player control and execution"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
opom = "opom.cli:main"

[tool.setuptools.packages.find]
include = ["opom*"]
