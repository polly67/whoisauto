name: macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One runner per ref: a new push cancels the previous run instead of queueing
# another macOS job behind it.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + smoke
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Test
        run: python -m pytest -q

      - name: Start opom
        run: |
          python -m whoisauto start --opom-port 8765
          python -m whoisauto status

      - name: Panel sees the API
        run: |
          python -m whoisauto serve --port 8099 --no-browser > /tmp/panel.log 2>&1 &
          for _ in $(seq 30); do
            if grep -q "whoisauto: http" /tmp/panel.log 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/panel.log
          curl -fsS http://127.0.0.1:8099/api/state > state.json
          python - <<'PY'
          import json
          state = json.load(open("state.json"))
          assert state["service"]["running"], state
          assert state["service"]["port"] == 8765, state["service"]
          assert state["install"]["opom"]["present"], state["install"]
          print("panel ok:", state["service"]["port"], state["platform"])
          PY
          pkill -f "whoisauto serve" || true

      - name: Port conflict handling
        run: |
          python -m whoisauto stop --opom-port 8765

          # occupy 8770; the panel must fall back to 8771 instead of dying on bind
          python - <<'PY' &
          import socket, time
          holder = socket.socket()
          holder.bind(("127.0.0.1", 8770))
          holder.listen(1)
          print("holding 8770", flush=True)
          time.sleep(120)
          PY
          HOLDER=$!
          sleep 1

          python -m whoisauto start --opom-port 8770
          python -m whoisauto status --opom-port 8770 | tee status.json
          python - <<'PY'
          import json
          status = json.load(open("status.json"))["service"]
          assert status["running"], status
          assert status["port"] == 8771, f"expected fallback 8771, got {status['port']}"
          print("fallback port:", status["port"])
          PY
          kill $HOLDER

      - name: Stop
        if: always()
        run: python -m whoisauto stop || true
