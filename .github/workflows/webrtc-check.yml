name: WebRTC transport checks
on:
  push:
    branches: [codex/webrtc-desktop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install WebRTC libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-venv gir1.2-nice-0.1 gir1.2-gst-plugins-bad-1.0 gstreamer1.0-plugins-bad gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-nice
          python3 -m venv --system-site-packages .test-rtc
          .test-rtc/bin/pip install -e '.[test]' aiortc
      - name: Unit checks
        run: |
          .test-rtc/bin/python -m pytest -q tests/test_desktop.py
          node --test tests/test_desktop.js
      - name: Receive actual H.264 WebRTC frames
        run: .test-rtc/bin/python scripts/bench/webrtc_smoke.py
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile desktop input
        run: xcrun swiftc whoisauto/native/desktop_input.swift -O -o /tmp/desktop-input
      - name: Check native capture and hardware encoding
        run: |
          brew install gstreamer pygobject3 python
          "$(brew --prefix)/bin/python3" - <<'PY'
          import gi
          gi.require_version("Gst", "1.0")
          from gi.repository import Gst
          from whoisauto.desktop import bind_tailnet
          Gst.init(None)
          for name in ("avfvideosrc", "vtenc_h264", "webrtcbin"):
              assert Gst.ElementFactory.find(name), name
          pipeline = Gst.Pipeline.new("interface-check")
          peer = Gst.ElementFactory.make("webrtcbin")
          pipeline.add(peer)
          bind_tailnet(peer, "127.0.0.1")
          pipeline.set_state(Gst.State.NULL)
          print("Native capture, VideoToolbox and WebRTC plugins available")
          PY
