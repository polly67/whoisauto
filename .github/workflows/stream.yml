name: WebRTC over Tailscale and whoisauto panel

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: macOS runner label
        default: macos-latest
      place_id:
        description: Optional place ID
        default: ''
      autoexec_script:
        description: Optional Luau auto-execute script
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    name: WebRTC Mac desktop
    runs-on: ${{ inputs.runner_label || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install capture and display tools
        run: |
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install gstreamer pygobject3 python displayplacer waydabber/betterdisplay/betterdisplaycli
          brew install --cask betterdisplay
          brew link --overwrite betterdisplaycli || true
          "$(brew --prefix)/bin/python3" -m venv --system-site-packages .stream-venv
          .stream-venv/bin/python -m pip install -e .
          echo "$GITHUB_WORKSPACE/.stream-venv/bin" >> "$GITHUB_PATH"
          .stream-venv/bin/python - <<'PY'
          import gi
          gi.require_version("Gst", "1.0")
          gi.require_version("GstWebRTC", "1.0")
          from gi.repository import Gst
          Gst.init(None)
          for name in ("webrtcbin", "avfvideosrc", "vtenc_h264", "rtph264pay"):
              assert Gst.ElementFactory.find(name), f"missing {name}"
          print(Gst.version_string())
          PY

      - name: Create the desktop display
        env:
          DISP_W: '1280'
          DISP_H: '720'
        run: bash scripts/ci/setup_display.sh

      - name: Install Opiumware and patched Roblox
        run: bash scripts/ci/install_apps.sh

      - name: Build the Luau syntax checker
        run: python -m whoisauto build-compiler

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Record private media address
        run: |
          sudo tailscale set --accept-dns=false
          echo "WHOISAUTO_TAILSCALE_IP=$(tailscale ip -4)" >> "$GITHUB_ENV"

      - name: Start API and WebRTC panel
        run: |
          python -m whoisauto start
          xcrun swiftc whoisauto/native/desktop_input.swift -O -o runtime/state/desktop-input
          bash scripts/ci/start_panel.sh
          {
            echo "## WebRTC desktop"
            echo "Connect your mobile device to Tailscale, then open the panel's Desktop tab. H.264 video and controls use the tailnet."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public panel
        run: bash scripts/ci/check_panel.sh

      - name: Publish desktop access
        uses: actions/upload-artifact@v4
        with:
          name: panel-endpoint
          path: panel-endpoint.json
          retention-days: 1

      - name: Arm auto exec
        env:
          AUTOEXEC_SCRIPT: ${{ inputs.autoexec_script }}
        run: |
          python - "http://127.0.0.1:$PANEL_PORT" "$PANEL_TOKEN" <<'PY'
          import json, os, pathlib, sys, urllib.request
          url, token = sys.argv[1:3]
          script = os.environ.get("AUTOEXEC_SCRIPT", "")
          if not script.strip():
              path = pathlib.Path("scripts/autoexec.luau")
              if not path.is_file():
                  print("no auto exec script supplied and scripts/autoexec.luau is absent; leaving it off")
                  raise SystemExit(0)
              script = path.read_text()
          body = json.dumps({"enabled": True, "script": script}).encode()
          request = urllib.request.Request(url + "/api/autoexec", data=body, headers={
              "Authorization": "Bearer " + token, "Content-Type": "application/json"})
          config = json.load(urllib.request.urlopen(request, timeout=30))["config"]
          print("auto exec armed: enabled={enabled} name={name} bytes={bytes}".format(**config))
          PY

      - name: Join place
        if: ${{ inputs.place_id != '' }}
        env:
          PLACE_ID: ${{ inputs.place_id }}
        run: |
          python - "http://127.0.0.1:$PANEL_PORT" "$PANEL_TOKEN" "$PLACE_ID" <<'PY'
          import json, sys, urllib.request
          url, token, place = sys.argv[1:4]
          body = json.dumps({"place_id": int(place), "wait": 20}).encode()
          request = urllib.request.Request(url + "/api/join", data=body, headers={
              "Authorization": "Bearer " + token, "Content-Type": "application/json"})
          print(urllib.request.urlopen(request, timeout=60).read().decode())
          PY

      - name: Keep desktop alive
        run: |
          caffeinate -d -i -m -s -u &
          while true; do
            python - <<'PY'
          import os, urllib.request
          from whoisauto.config import Paths, read_json
          record = read_json(Paths.load().state / "panel.json")
          if not record:
              raise SystemExit("Panel stopped")
          request = urllib.request.Request(record["url"] + "/api/state", headers={
              "Authorization": "Bearer " + os.environ["WHOISAUTO_ACCESS_TOKEN"]})
          with urllib.request.urlopen(request, timeout=15) as response:
              assert response.status == 200
          PY
            sleep 30
          done

      - name: Shut down
        if: always()
        run: |
          pkill -f 'cloudflared tunnel' || true
          pkill -f 'whoisauto serve' || true
          python -m whoisauto stop || true
