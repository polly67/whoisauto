name: live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to keep the panel online (max 350)"
        required: true
        default: "60"
      place_id:
        description: "Place id to join once the API is up (blank = skip)"
        required: false
        default: ""
      tailscale:
        description: "Join the tailnet for SSH access (needs TAILSCALE_AUTHKEY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-panel
  cancel-in-progress: true

jobs:
  live:
    name: macOS panel + cloudflared
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install whoisauto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Opiumware and patched Roblox
        run: |
          # the bundled Injector is Intel; arm64 runners need Rosetta
          sudo softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "rosetta: usable"
          else
            echo "::warning::Rosetta is not usable; the Intel Injector will fail"
          fi

          # the installer opens with `clear` and runs under set -euo pipefail;
          # with TERM unset that single failure aborts the whole install
          export TERM=xterm-256color

          curl -fsSL "https://gitlab.com/norbyv1/opiumware/-/raw/main/inst" -o /tmp/opium-inst.sh
          set +e
          bash /tmp/opium-inst.sh 2>&1 | tee /tmp/opium-install.log
          INSTALL_STATUS=${PIPESTATUS[0]}
          set -e
          echo "installer exit: $INSTALL_STATUS"
          echo "rosetta: $(pgrep -q oahd && echo present || echo absent)"
          tail -40 /tmp/opium-install.log || true
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "::warning::Opiumware installer exited $INSTALL_STATUS; continuing without a Player"
          fi

          # the installer uses /Applications when writable, otherwise ~/Applications
          if [ -d /Applications/Opiumware.app ]; then APP_DIR=/Applications; else APP_DIR="$HOME/Applications"; fi
          {
            echo "OPOM_ROOT=$HOME/Opiumware"
            echo "OPOM_ROBLOX_APP=$APP_DIR/Roblox.app"
            echo "OPOM_EDITOR_APP=$APP_DIR/Opiumware.app"
            echo "OPOM_WORKSPACE=$HOME/Opiumware/workspace"
          } >> "$GITHUB_ENV"
          ls -la "$APP_DIR" || true
          for app in "$APP_DIR/Roblox.app" "$APP_DIR/Opiumware.app"; do
            if [ -d "$app" ]; then echo "installed: $app"; else echo "::warning::missing $app"; fi
          done

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opium-install-log
          retention-days: 3
          if-no-files-found: ignore
          path: /tmp/opium-install.log

      - name: Start opom
        run: |
          # opom refuses /execute with compiler_missing until this exists
          python -m whoisauto build-compiler || echo "::warning::Luau checker build failed; Execute will refuse scripts"
          python -m whoisauto start
          python -m whoisauto status

      - name: Start panel and open the tunnel
        run: |
          TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(18))")
          export WHOISAUTO_ACCESS_TOKEN="$TOKEN" PANEL_TOKEN="$TOKEN"
          echo "WHOISAUTO_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "PANEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

          python -u -m whoisauto serve --port 8080 --no-browser > /tmp/panel.log 2>&1 &
          PANEL_PID=$!
          PORT=""
          for _ in $(seq 30); do
            PORT=$(python -c "import json; print(json.load(open('runtime/state/panel.json'))['port'])" 2>/dev/null || true)
            if [ -n "$PORT" ]; then break; fi
            sleep 1
          done
          echo "panel log:"; cat /tmp/panel.log 2>/dev/null || true
          echo "panel pid $PANEL_PID: $(ps -p $PANEL_PID -o stat= 2>/dev/null || echo gone)"
          if [ -z "$PORT" ]; then
            echo "panel did not start"
            pgrep -fl whoisauto || true
            exit 1
          fi
          echo "panel port: $PORT"
          echo "PANEL_PORT=$PORT" >> "$GITHUB_ENV"

          brew install cloudflared >/dev/null 2>&1 || true
          cloudflared tunnel --url "http://127.0.0.1:$PORT" --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          for _ in $(seq 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "cloudflared did not publish a URL"; tail -40 /tmp/cloudflared.log; exit 1
          fi
          echo "PANEL_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=whoisauto panel::$URL/?token=$TOKEN"
          python - "$URL" "$TOKEN" <<'PY'
          import json, sys
          url, token = sys.argv[1:3]
          json.dump({"panel_url": url, "access_token": token, "open": f"{url}/?token={token}"},
                    open("panel-endpoint.json", "w"), indent=2)
          PY

      - name: Verify the public URL
        run: |
          local_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $PANEL_TOKEN" "http://127.0.0.1:$PANEL_PORT/api/state" || true)
          echo "local /api/state -> $local_code"
          [ "$local_code" = "200" ] || { echo "panel is not answering locally"; exit 1; }

          anon_local=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PANEL_PORT/api/state" || true)
          echo "local anonymous -> $anon_local (expected 401)"
          [ "$anon_local" = "401" ] || { echo "panel is exposed without auth"; exit 1; }

          # A runner cannot always reach its own quick tunnel (egress or DNS),
          # so this is a warning: the URL still works from outside.
          code=""
          for _ in $(seq 1 8); do
            code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $PANEL_TOKEN" "$PANEL_URL/api/state" || true)
            echo "public /api/state -> $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::warning::runner could not reach $PANEL_URL; try it from your machine"
            echo "--- cloudflared log ---"; tail -40 /tmp/cloudflared.log || true
            echo "--- dns ---"; nslookup "${PANEL_URL#https://}" || true
            echo "--- verbose curl ---"; curl -sv --max-time 15 -H "Authorization: Bearer $PANEL_TOKEN" "$PANEL_URL/api/state" 2>&1 | tail -30 || true
          fi

      - name: Publish panel endpoint
        uses: actions/upload-artifact@v4
        with:
          name: panel-endpoint
          retention-days: 1
          path: panel-endpoint.json

      - name: Join place
        if: ${{ inputs.place_id != '' }}
        env:
          PLACE_ID: ${{ inputs.place_id }}
        run: |
          python - "$PANEL_URL" "$PANEL_TOKEN" "$PLACE_ID" <<'PY'
          import json, sys, urllib.request
          url, token, place = sys.argv[1:4]
          body = json.dumps({"place_id": int(place), "wait": 20}).encode()
          request = urllib.request.Request(url + "/api/join", data=body, headers={
              "Authorization": "Bearer " + token, "Content-Type": "application/json"})
          print(urllib.request.urlopen(request, timeout=60).read().decode())
          PY

      - name: Tailscale
        if: ${{ inputs.tailscale }}
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Publish connection details
        run: |
          {
            echo "## whoisauto panel is live"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Panel | $PANEL_URL/?token=$PANEL_TOKEN |"
            echo "| Access token | \`$PANEL_TOKEN\` |"
            echo "| opom port | $(python -m whoisauto status | python -c 'import json,sys; print(json.load(sys.stdin)["service"].get("port"))' || echo unknown) |"
            echo "| Runner | $(uname -m) macOS $(sw_vers -productVersion) |"
            echo ""
            echo "Ends when this job stops (timeout ${MINUTES}m)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MINUTES: ${{ inputs.minutes }}

      - name: Keep alive
        run: sleep $(( ${{ inputs.minutes }} * 60 ))

      - name: Shut down
        if: always()
        run: |
          pkill -f "cloudflared tunnel" || true
          pkill -f "whoisauto serve" || true
          python -m whoisauto stop || true
