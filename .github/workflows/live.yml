name: live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to keep the panel online (max 350)"
        required: true
        default: "60"
      place_id:
        description: "Place id to join once the API is up (blank = skip)"
        required: false
        default: ""
      tailscale:
        description: "Join the tailnet for SSH access (needs TAILSCALE_AUTHKEY)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-panel
  cancel-in-progress: true

jobs:
  live:
    name: macOS panel + cloudflared
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate duration
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          python - <<'PY'
          import os
          value = os.environ["MINUTES"]
          if not value.isascii() or not value.isdigit() or not 1 <= int(value) <= 350:
              raise SystemExit("minutes must be an integer from 1 to 350")
          PY

      - name: Install whoisauto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Opiumware and patched Roblox
        run: |
          # the bundled Injector is Intel; arm64 runners need Rosetta
          # the installer opens with `clear` and runs under set -euo pipefail;
          # with TERM unset that single failure aborts the whole install
          # the installer uses /Applications when writable, otherwise ~/Applications
          bash scripts/ci/install_apps.sh

      - name: Upload installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opium-install-log
          retention-days: 3
          if-no-files-found: ignore
          path: /tmp/opium-install.log

      - name: Start opom
        run: |
          # opom refuses /execute with compiler_missing until this exists
          python -m whoisauto build-compiler || echo "::warning::Luau checker build failed; Execute will refuse scripts"
          python -m whoisauto start
          python -m whoisauto status

      - name: Start panel and open the tunnel
        run: bash scripts/ci/start_panel.sh

      - name: Verify the public URL
        run: |
          # A runner cannot always reach its own quick tunnel (egress or DNS),
          # so this is a warning: the URL still works from outside.
          bash scripts/ci/check_panel.sh

      - name: Publish panel endpoint
        uses: actions/upload-artifact@v4
        with:
          name: panel-endpoint
          retention-days: 1
          path: panel-endpoint.json

      - name: Join place
        if: ${{ inputs.place_id != '' }}
        env:
          PLACE_ID: ${{ inputs.place_id }}
        run: |
          python - "http://127.0.0.1:$PANEL_PORT" "$PANEL_TOKEN" "$PLACE_ID" <<'PY'
          import json, sys, urllib.request
          url, token, place = sys.argv[1:4]
          body = json.dumps({"place_id": int(place), "wait": 20}).encode()
          request = urllib.request.Request(url + "/api/join", data=body, headers={
              "Authorization": "Bearer " + token, "Content-Type": "application/json"})
          print(urllib.request.urlopen(request, timeout=60).read().decode())
          PY

      - name: Tailscale
        if: ${{ inputs.tailscale }}
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Publish connection details
        run: |
          {
            echo "## whoisauto panel is live"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Panel | $PANEL_URL/?token=$PANEL_TOKEN |"
            echo "| Access token | \`$PANEL_TOKEN\` |"
            echo "| opom port | $(python -m whoisauto status | python -c 'import json,sys; print(json.load(sys.stdin)["service"].get("port"))' || echo unknown) |"
            echo "| Runner | $(uname -m) macOS $(sw_vers -productVersion) |"
            echo ""
            echo "Ends when this job stops (timeout ${MINUTES}m)."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MINUTES: ${{ inputs.minutes }}

      - name: Keep alive
        env:
          MINUTES: ${{ inputs.minutes }}
        run: sleep "$((10#$MINUTES * 60))"

      - name: Shut down
        if: always()
        run: |
          pkill -f "cloudflared tunnel" || true
          pkill -f "whoisauto serve" || true
          python -m whoisauto stop || true
